<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>MovieHub - Discover Your Next Favorite Film</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <meta name="description" content="Discover the latest movies, TV shows, and classics.">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <h1>🎬 MovieHub</h1>
                <div class="header-actions">
                    <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">🌙</button>
                </div>
            </div>
            <div class="header-bottom">
                <div class="toggle-buttons">
                    <button id="allToggle" class="toggle-btn active" data-type="all">All</button>
                    <button id="movieToggle" class="toggle-btn" data-type="movie">Movies</button>
                    <button id="tvToggle" class="toggle-btn" data-type="tv">TV Shows</button>
                </div>
                <div class="search-bar">
                    <input type="text" placeholder="Search movies or TV shows..." aria-label="Search">
                    <button aria-label="Search button">🔍</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section id="hero">
            <div class="container">
                <h2>Welcome to MovieHub</h2>
                <p>Discover the latest movies, classics, and everything in between.</p>
            </div>
        </section>

        <section id="content">
            <div class="container">
                <div class="section-header">
                    <h2>Featured Content</h2>
                    <span id="contentCount" class="content-count"></span>
                </div>
                <div class="movie-grid" id="movieGrid">
                    <!-- Content will be populated dynamically -->
                </div>
            </div>
        </section>

        <!-- Content Details Modal -->
        <div id="movieModal" class="modal">
            <div class="modal-backdrop" onclick="closeModal()"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <button onclick="closeModal()" class="back-btn" aria-label="Close">← Back</button>
                    <button onclick="closeModal()" class="close-btn" aria-label="Close">✕</button>
                </div>
                <div class="movie-details">
                    <div class="poster-container">
                        <img id="modalPoster" src="" alt="Content Poster" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                    </div>
                    <div class="details-text">
                        <h2 id="modalTitle"></h2>
                        <div class="rating-badge" id="modalRating"></div>
                        <p id="modalInfo" class="meta-info"></p>
                        <p id="modalOverview" class="overview-text"></p>
                    </div>
                </div>
                <div id="trailerSection" class="trailer-section">
                    <h3>📽️ Trailer</h3>
                    <div class="trailer-container">
                        <iframe id="trailerIframe" frameborder="0" allowfullscreen style="display: none;"></iframe>
                        <p id="noTrailerMsg" style="display: none;">No trailer available.</p>
                    </div>
                </div>
                <button id="playButton" class="play-btn" onclick="playContent()">▶ Play Full Movie</button>
                <div id="streamingSection" style="display: none;">
                    <h3>🎥 Watch Content</h3>
                    <div class="provider-controls">
                        <select id="seasonSelect" style="display: none;"></select>
                        <select id="episodeSelect" style="display: none;"></select>
                        <select id="providerSelect"></select>
                        <button id="refreshButton" class="refresh-btn">🔄 Refresh</button>
                    </div>
                    <div class="streaming-container">
                        <iframe id="streamingIframe" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 MovieHub. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
